name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  id-token: write
  contents: write
  pages: write

jobs:
  build:

    runs-on: ubuntu-latest
    #test
    steps:
    # Github actions have Node and Yarn already set-up by default
    # It is not clear which versions these are, 
    # so it might be a good idea to specify them via an action like actions/setup-node@v4
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install
      run: yarn
    - name: Unit tests
      run: yarn test
    - name: Build
      run: yarn build
    - name: Integration tests
      run: yarn test:e2e
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() }}       # run this step even if previous step failed
      with:
        name: JEST Tests            # Name of the check run which will be created
        path: reports/jest-junit.xml    # Path to test results
        reporter: jest-junit        # Format of test results
    - name: Tag commit with auto-incremented version
      if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      run: |
        git fetch --tags
        LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || echo "")
        if [ -z "$LATEST_TAG" ]; then
          NEW_VERSION="1.0.0"
        else
          CLEAN_TAG="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
        fi
        echo "New version: v${NEW_VERSION}"
        git tag "v${NEW_VERSION}"
        git push origin "v${NEW_VERSION}"
